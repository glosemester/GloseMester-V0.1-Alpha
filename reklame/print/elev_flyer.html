<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elev Flyer (A5)</title>
    <!-- Gjenbruk CSS for branding -->
    <link rel="stylesheet" href="../../css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #e0e0e0;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .a5-flyer {
            width: 148mm;
            height: 210mm;
            background: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            text-align: center;
            /* Print fix */
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }

            .a5-flyer {
                box-shadow: none;
                width: 100%;
                height: 100%;
            }
        }

        .hero-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 45%;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            position: relative;
            z-index: 1;
        }

        .hero-title {
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .card-preview {
            position: absolute;
            bottom: -50px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .mini-card {
            width: 90px;
            height: 130px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            border: 4px solid white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            transform: rotate(-10deg);
        }

        .mini-card-legendary {
            background: linear-gradient(to bottom, #FFF 80%, #FFFBEB 100%);
        }

        .emoji-medium {
            font-size: 2rem;
        }

        .emoji-large {
            font-size: 2.5rem;
        }

        .mini-card:nth-child(2) {
            transform: rotate(5deg) translateY(-10px);
            z-index: 2;
            border-color: gold;
        }

        .mini-card:nth-child(3) {
            transform: rotate(15deg);
        }

        .content {
            margin-top: 70px;
            padding: 20px;
            flex: 1;
        }

        .step-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .step-num {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .footer-section {
            margin-top: 30px;
        }

        .url-box {
            background: #2d3748;
            color: white;
            padding: 15px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: auto;
            margin-bottom: 20px;
            display: inline-block;
            padding-left: 40px;
            padding-right: 40px;
        }

        .footer-text {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="a5-flyer">
        <div class="hero-bg">
            <h1 class="hero-title">Samle Kort!</h1>
            <p class="hero-subtitle">Gjør leksene om til et spill 🎮</p>

            <div class="card-preview">
                <div class="mini-card">
                    <span class="emoji-medium">🐉</span>
                </div>
                <!-- Legendary Card -->
                <div class="mini-card mini-card-legendary">
                    <span class="emoji-large">🦁</span>
                </div>
                <div class="mini-card">
                    <span class="emoji-medium">🚀</span>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="step-box">
                <div class="step-num">1</div>
                <div>
                    <strong>Gå til nettsiden</strong><br>
                    Åpne på mobil, iPad eller PC.
                </div>
            </div>

            <div class="step-box">
                <div class="step-num">2</div>
                <div>
                    <strong>Velg "Øv Selv"</strong><br>
                    Velg GloseMester, MatteMester eller NorskMester.
                </div>
            </div>

            <div class="step-box">
                <div class="step-num">3</div>
                <div>
                    <strong>Vinn nye kort!</strong><br>
                    Svarer du riktig, får du pakker med kort.
                </div>
            </div>

            <div class="footer-section">
                <div class="url-box">glosemester.no</div>
                <p class="footer-text">Gratis • Ingen reklame • Trygt</p>
            </div>
        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="GloseMester – Lær engelske gloser med gamification og kortsamling. Lærere lager tester på 2 minutter og deler med QR-kode." />
    <meta name="keywords" content="gloser engelsk, glose-test, lære engelske ord, engelsk skole, norsk skole, GloseMester" />
    <meta property="og:title" content="GloseMester – Lær engelske gloser" />
    <meta property="og:description" content="Lær engelske gloser, samle samlekort og mestre språket. For elever og lærere i norsk skole." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://glosemester.no/" />
    <title>GloseMester – Lær engelske gloser på en morsom måte</title>

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "EducationalApplication",
        "name": "GloseMester",
        "description": "Gamifisert glose-læring for norske skoler. Elever øver engelske gloser og samler kort. Lærere lager tester på 2 minutter.",
        "url": "https://glosemester.no",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": "nb",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NOK" },
        "audience": { "@type": "EducationalAudience", "educationalRole": ["student", "teacher"] }
    }
    </script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GloseMester" />
    <link rel="apple-touch-icon" href="icon.png" />

    <!-- Fonter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="src/styles/redesign.css" />
    <link rel="stylesheet" href="src/styles/landing.css" />
    <link rel="stylesheet" href="src/styles/glosemester.css" />
    <link rel="stylesheet" href="src/styles/teacher.css" />

    <!-- QRCode.js (for teacher module) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            height: 100%; 
            font-family: var(--font-body, 'Inter', system-ui, sans-serif); 
            background: var(--background, #F5F3FF); 
            color: var(--text-dark, #1F2937);
            overflow-x: hidden;
        }
        
        #app { 
            min-height: 100vh;
            transition: padding-left 0.3s ease;
        }

        /* Sidebar adjustment for desktop */
        @media (min-width: 1024px) {
            body.has-sidebar #app {
                padding-left: 280px;
            }
        }

        #loading-screen {
            position: fixed; inset: 0; background: var(--background, #F5F3FF);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.4s;
        }
        #loading-screen .logo { font-size: 72px; margin-bottom: 16px; animation: pulse 1.5s infinite; }
        #loading-screen p { font-family: var(--font-heading, 'Outfit', system-ui); font-size: 20px; font-weight: 700; color: var(--primary-purple, #7C3AED); }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E22EHLQXVG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-E22EHLQXVG');
    </script>
</head>
<body>
    <!-- Loading screen -->
    <div id="loading-screen">
        <div class="logo">🎓</div>
        <p>GloseMester laster…</p>
    </div>

    <!-- Main SPA container -->
    <div id="app"></div>

    <!-- App entry point -->
    <script type="module" src="src/app.js"></script>
    <script type="module">
        // Skjul lasteskjermen når DOM er klar
        window.addEventListener('DOMContentLoaded', () => {
            const ls = document.getElementById('loading-screen');
            if (ls) setTimeout(() => { 
                ls.style.opacity = '0'; 
                setTimeout(() => ls.remove(), 400); 
            }, 500);
        });
    </script>
</body>
</html>

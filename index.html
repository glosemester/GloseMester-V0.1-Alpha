<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="GloseMester – Lær engelske gloser med gamification og kortsamling. Lærere lager tester på 2 minutter og deler med QR-kode." />
    <meta name="keywords" content="gloser engelsk, glose-test, lære engelske ord, engelsk skole, norsk skole, GloseMester" />
    <meta property="og:title" content="GloseMester – Lær engelske gloser" />
    <meta property="og:description" content="Lær engelske gloser, samle samlekort og mestre språket. For elever og lærere i norsk skole." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://glosemester.no/" />
    <title>GloseMester – Lær engelske gloser på en morsom måte</title>

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "EducationalApplication",
        "name": "GloseMester",
        "description": "Gamifisert glose-læring for norske skoler. Elever øver engelske gloser og samler kort. Lærere lager tester på 2 minutter.",
        "url": "https://glosemester.no",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": "nb",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NOK" },
        "audience": { "@type": "EducationalAudience", "educationalRole": ["student", "teacher"] }
    }
    </script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#FF6B47" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GloseMester" />
    <link rel="apple-touch-icon" href="icon.png" />

    <!-- Fonter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/redesign.css" />
    <link rel="stylesheet" href="src/styles/landing.css" />
    <link rel="stylesheet" href="src/styles/glosemester.css" />
    <link rel="stylesheet" href="src/styles/teacher.css" />
    <link rel="stylesheet" href="src/styles/menu.css" />

    <!-- QRCode.js (for teacher module) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            height: 100%; 
            font-family: var(--font-body, 'Inter', system-ui, sans-serif); 
            background: var(--background, #F5F3FF); 
            color: var(--text-dark, #1F2937);
            overflow-x: hidden;
        }
        
        #app { 
            min-height: 100vh;
            transition: padding-left 0.3s ease;
        }

        /* Sidebar adjustment for desktop */
        @media (min-width: 1024px) {
            body.has-sidebar #app {
                padding-left: 280px;
            }
        }

        #loading-screen {
            position: fixed; inset: 0; background: #FAFAF8;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.4s;
            font-family: 'Nunito', 'Arial Rounded MT Bold', system-ui, sans-serif;
        }
        #loading-screen .ls-g {
            width: 120px; height: auto; overflow: visible;
            filter: drop-shadow(0 4px 12px rgba(255,107,71,0.2));
        }
        #loading-screen .ls-g-path {
            stroke: #FF6B47; stroke-width: 5;
            stroke-linecap: round; stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 1; stroke-dashoffset: 1;
            animation: lsDrawG 1.4s ease-in-out forwards;
        }
        @keyframes lsDrawG { to { stroke-dashoffset: 0; } }
        #loading-screen .ls-wordmark {
            font-size: 17px; font-weight: 400;
            letter-spacing: 0.28em; text-transform: uppercase;
            color: #FF6B47; line-height: 1;
            margin: 16px 0 0;
            opacity: 0;
            animation: lsFadeUp 0.6s ease forwards;
            animation-delay: 1.3s;
        }
        @keyframes lsFadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E22EHLQXVG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-E22EHLQXVG');
    </script>
</head>
<body>
    <!-- Loading screen -->
    <div id="loading-screen">
        <svg class="ls-g" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="ls-g-path" pathLength="1"
                d="M 156,52
                   C 138,24 100,16 68,30
                   C 36,44 20,74 20,104
                   C 20,140 42,168 74,178
                   C 106,188 140,174 156,150
                   C 164,134 162,114 152,104
                   L 100,104"
            />
        </svg>
        <div class="ls-wordmark">GloseMester</div>
    </div>

    <!-- Main SPA container -->
    <div id="app"></div>

    <!-- App entry point -->
    <script type="module" src="src/app.js"></script>
    <script type="module">
        // Skjul lasteskjermen når DOM er klar
        window.addEventListener('DOMContentLoaded', () => {
            const ls = document.getElementById('loading-screen');
            if (ls) setTimeout(() => { 
                ls.style.opacity = '0'; 
                setTimeout(() => ls.remove(), 400); 
            }, 500);
        });
    </script>
</body>
</html>

# Nginx-konfig for test.glosemester.no (GloseMester v3)
#
# Plasseres på serveren som /etc/nginx/sites-available/glosemester-test
# (symlink til sites-enabled), deretter `sudo nginx -t && sudo systemctl reload nginx`.
#
# To viktige ting:
#  1) SPA-fallback: alle ruter som ikke er en ekte fil serveres som index.html,
#     ellers gir refresh/direktelenker (f.eks. /laerer/prove/abc) 404.
#  2) Proxy av /.netlify/functions/*: v3 kaller Feide/Stripe-funksjonene på
#     samme origin. De finnes kun på Netlify (glosemester.no), så vi proxyer
#     dem dit slik at innlogging og betaling virker fra testdomenet.

server {
    listen 80;
    server_name test.glosemester.no;

    root /var/www/glosemester-test;
    index index.html;

    # Proxy serverless-funksjonene til prod-Netlify (Feide + Stripe).
    # Merk: Stripe står i test-modus, så ingen ekte betaling skjer.
    location /.netlify/functions/ {
        proxy_pass https://glosemester.no;
        proxy_set_header Host glosemester.no;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Statiske filer med lang cache (de har innholds-hash i navnet).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-fallback: ekte filer serveres direkte, alt annet → index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# TLS (HTTPS) anbefales — bruk certbot:
#   sudo certbot --nginx -d test.glosemester.no
# Feide og Stripe krever HTTPS for redirect-URL-er i produksjon; for ren
# test mot testkort kan HTTP fungere, men HTTPS er tryggest.

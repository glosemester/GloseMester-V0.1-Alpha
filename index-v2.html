<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light only">

    <!-- SEO Meta Tags -->
    <title>Mester Suite - Hva skal vi øve i dag?</title>
    <meta name="description"
        content="Mester Suite - Multifaglig læringsplattform med GloseMester, MatteMester og NorskMester. Lær gloser, matte og norsk med gamification!">
    <meta name="keywords"
        content="mester suite, glosemester, mattemester, norskmester, læring, gamification, skole, elever, lærere">
    <meta name="author" content="Mester Suite">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://glosemester.no/">
    <meta property="og:title" content="Mester Suite - Multifaglig læringsplattform">
    <meta property="og:description"
        content="Lær gloser, matte og norsk med Mester Suite! Samle kort, ta prøver og få god læring.">
    <meta property="og:image" content="https://glosemester.no/header.png">

    <!-- PWA Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mester Suite">
    <meta name="theme-color" content="#667eea">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/kort.css">
    <link rel="stylesheet" href="css/popups.css">
    <link rel="stylesheet" href="src/styles/landing.css">

    <style>
        /* Global reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app {
            min-height: 100vh;
        }

        /* Loading spinner */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .loading h2 {
            margin-top: 20px;
            font-size: 24px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Main App Container -->
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <h2>Laster Mester Suite...</h2>
        </div>
    </div>

    <!-- Load app as ES6 module -->
    <script type="module" src="src/app.js"></script>
</body>

</html>

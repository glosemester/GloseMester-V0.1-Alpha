<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="GloseMester – Lær engelske gloser med gamification og kortsamling. Lærere lager tester på 2 minutter og deler med QR-kode." />
    <meta name="keywords" content="gloser engelsk, glose-test, lære engelske ord, engelsk skole, norsk skole, GloseMester" />
    <meta property="og:title" content="GloseMester – Lær engelske gloser" />
    <meta property="og:description" content="Lær engelske gloser, samle samlekort og mestre språket. For elever og lærere i norsk skole." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://glosemester.no/" />
    <title>GloseMester – Lær engelske gloser på en morsom måte</title>

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "EducationalApplication",
        "name": "GloseMester",
        "description": "Gamifisert glose-læring for norske skoler. Elever øver engelske gloser og samler kort. Lærere lager tester på 2 minutter.",
        "url": "https://glosemester.no",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": "nb",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NOK" },
        "audience": { "@type": "EducationalAudience", "educationalRole": ["student", "teacher"] }
    }
    </script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#FF6B47" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GloseMester" />
    <link rel="apple-touch-icon" href="icon.png" />

    <!-- Fonter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="src/styles/redesign.css" />
    <link rel="stylesheet" href="src/styles/landing.css" />
    <link rel="stylesheet" href="src/styles/glosemester.css" />
    <link rel="stylesheet" href="src/styles/teacher.css" />
    <link rel="stylesheet" href="src/styles/menu.css" />

    <!-- QRCode.js (for teacher module) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            height: 100%; 
            font-family: var(--font-body, 'Inter', system-ui, sans-serif); 
            background: var(--background, #F5F3FF); 
            color: var(--text-dark, #1F2937);
            overflow-x: hidden;
        }
        
        #app { 
            min-height: 100vh;
            transition: padding-left 0.3s ease;
        }

        /* Sidebar adjustment for desktop */
        @media (min-width: 1024px) {
            body.has-sidebar #app {
                padding-left: 280px;
            }
        }

        #loading-screen {
            position: fixed; inset: 0; background: #FAFAF8;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.4s;
            font-family: 'Nunito', 'Arial Rounded MT Bold', sans-serif;
        }
        #loading-screen .ls-g {
            width: 110px; height: auto;
            transform-origin: bottom center;
            animation: lsBounce 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            filter: drop-shadow(0 6px 16px rgba(255,107,71,0.28));
        }
        @keyframes lsBounce {
            0%   { opacity: 0; transform: translateY(-320px) scaleY(1.1); }
            60%  { opacity: 1; transform: translateY(0) scaleY(0.82) scaleX(1.1); }
            75%  { transform: translateY(-36px) scaleY(1.08); }
            88%  { transform: translateY(0) scaleY(0.96) scaleX(1.02); }
            94%  { transform: translateY(-8px) scaleY(1.01); }
            100% { transform: translateY(0) scaleY(1) scaleX(1); }
        }
        #loading-screen .ls-wordmark {
            font-size: 32px; font-weight: 900;
            letter-spacing: -0.025em; line-height: 1;
            margin: 10px 0 0;
            opacity: 0;
            animation: lsFadeUp 0.5s ease forwards;
            animation-delay: 0.9s;
        }
        #loading-screen .ls-glose  { color: #FF6B47; }
        #loading-screen .ls-mester { color: #1E1E2E; }
        #loading-screen .ls-underline {
            height: 3px; width: 0;
            background: linear-gradient(90deg, #FF6B47, #FFB347);
            border-radius: 999px; margin-top: 6px;
            animation: lsLine 0.4s ease forwards;
            animation-delay: 1.3s;
        }
        @keyframes lsFadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes lsLine { to { width: 140px; } }
    </style>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E22EHLQXVG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-E22EHLQXVG');
    </script>
</head>
<body>
    <!-- Loading screen -->
    <div id="loading-screen">
        <svg class="ls-g" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M65,23 C60,20 53,20 48,25 C40,33 34,48 35,63 C36,73 42,80 50,79 C59,78 65,71 67,61 C69,51 64,48 56,48 C48,48 44,52 44,52"
                  stroke="#FF6B47" stroke-width="6.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="ls-wordmark">
            <span class="ls-glose">Glose</span><span class="ls-mester">Mester</span>
        </div>
        <div class="ls-underline"></div>
    </div>

    <!-- Main SPA container -->
    <div id="app"></div>

    <!-- App entry point -->
    <script type="module" src="src/app.js"></script>
    <script type="module">
        // Skjul lasteskjermen når DOM er klar
        window.addEventListener('DOMContentLoaded', () => {
            const ls = document.getElementById('loading-screen');
            if (ls) setTimeout(() => { 
                ls.style.opacity = '0'; 
                setTimeout(() => ls.remove(), 400); 
            }, 500);
        });
    </script>
</body>
</html>

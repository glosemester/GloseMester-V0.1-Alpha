# Netlify-konfig — bygger og publiserer v3 (React/Vite) fra app-v3/.
# Tidligere publiserte denne v2 fra rota (publish="."). v2-koden ligger fortsatt
# i repoet (index.html, src/, js/) som referanse, men deployes ikke lenger.
# Eldre v2-deploys finnes i Netlify sin deploy-historikk om rollback trengs.
#
# Base holdes i repo-rota slik at rotas package.json (firebase-admin, stripe,
# resend) installeres — Netlify-funksjonene trenger disse. Byggekommandoen
# installerer og bygger v3 separat. Vite skriver til repo-rot/dist.

[build]
  command = "cd app-v3 && npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "http://178.105.131.153/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/webhook/*"
  to = "http://178.105.131.153/webhook/:splat"
  status = 200
  force = true

# Gamle v2-URLer (.html) → rene v3-ruter. Bevarer SEO/bokmerker etter at
# v2-sidene ble fjernet (B5). Netlify viderefører query-string automatisk, så
# stripe-checkout sin /oppgrader.html?status=... lander riktig på /oppgrader.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/for-laerere.html"
  to = "/for-laerere"
  status = 301
[[redirects]]
  from = "/for-skoler.html"
  to = "/for-skoler"
  status = 301
[[redirects]]
  from = "/om-oss.html"
  to = "/om-oss"
  status = 301
[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
[[redirects]]
  from = "/oppgrader.html"
  to = "/oppgrader"
  status = 301
[[redirects]]
  from = "/min-side.html"
  to = "/min-side"
  status = 301

# SPA-fallback: alle ruter som ikke er en ekte fil serveres som v3 sin index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
